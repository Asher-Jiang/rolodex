<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Rolodex">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2C6B51"/>
      <stop offset="1" stop-color="#163C2D"/>
    </linearGradient>
  </defs>

  <!-- App tile: an 824x824 art box centred in the 1024 canvas, at the macOS corner radius. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#tile)"/>

  <!-- Cards fanned behind the front one, resting on the gold spindle bar. -->
  <rect x="300" y="232" width="424" height="140" rx="40" fill="#B7BCAC"/>
  <rect x="256" y="282" width="512" height="150" rx="44" fill="#DCDACB"/>
  <rect x="240" y="754" width="544" height="38" rx="19" fill="#E9C976"/>

  <!-- Front card. The clipped bottom-left corner is the same 10:3 radius the
       in-app brand mark and avatars use. -->
  <path d="M268 334h488a56 56 0 0 1 56 56v288a56 56 0 0 1-56 56H229a17 17 0 0 1-17-17V390a56 56 0 0 1 56-56z" fill="#FFFEFA"/>

  <!-- Contact glyph on the front card: head, shoulders, two lines of detail. -->
  <circle cx="348" cy="492" r="54" fill="#215E45"/>
  <path d="M288 630v-18a60 60 0 0 1 120 0v18z" fill="#215E45"/>
  <rect x="456" y="476" width="278" height="36" rx="18" fill="#8FB3A1"/>
  <rect x="456" y="556" width="214" height="36" rx="18" fill="#BCD3C5"/>
</svg>
